<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <meta name="theme-color" content="#6C63FF" />
    <meta name="description" content="Radio S O - Сучасний PWA радіоплеєр. Слухайте улюблені станції з усього світу." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <title>Radio S O</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />
    
    <!-- Icons -->
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    
    <!-- Preconnect to critical domains -->
    <link rel="preconnect" href="https://de1.api.radio-browser.info" />
    <link rel="preconnect" href="https://stream.sunshine-live.de" />
    
    <!-- CSS -->
    <link rel="stylesheet" href="src/css/base.css" />
    <link rel="stylesheet" href="src/css/layout.css" />
    <link rel="stylesheet" href="src/css/components.css" />
    <link rel="stylesheet" href="src/css/player.css" />
    <link rel="stylesheet" href="src/css/responsive.css" />
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header id="app-header">
            <div class="logo">
                <span class="logo-icon">📻</span>
                <span class="logo-text">Radio S O</span>
            </div>
            <div class="header-actions">
                <button id="themeToggle" class="icon-btn" aria-label="Змінити тему">🌙</button>
                <button id="shareButton" class="icon-btn" aria-label="Поділитися">📤</button>
            </div>
        </header>

        <!-- Main Player Area -->
        <main id="main-content">
            <!-- Player Card -->
            <section id="player-section" aria-label="Аудіоплеєр">
                <div id="player" class="player-container">
                    <div class="player-artwork">
                        <div id="stationArtwork" class="artwork-placeholder">🎵</div>
                    </div>
                    
                    <div class="player-info">
                        <h2 id="stationName" class="station-name">Виберіть станцію</h2>
                        <p id="stationGenre" class="station-meta">жанр: -</p>
                        <p id="stationCountry" class="station-meta">країна: -</p>
                        <p id="currentTrack" class="current-track">🎵 Трек: невідомо</p>
                        <div id="connectionStatus" class="connection-status online">🟢 Онлайн</div>
                    </div>

                    <div class="player-controls">
                        <button id="prevBtn" class="control-btn" aria-label="Попередня станція">
                            <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                        </button>
                        
                        <button id="playPauseBtn" class="control-btn play-btn" aria-label="Грати">
                            <svg viewBox="0 0 24 24" width="40" height="40"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
                        </button>
                        
                        <button id="nextBtn" class="control-btn" aria-label="Наступна станція">
                            <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                        </button>
                    </div>

                    <div class="player-volume">
                        <button id="muteBtn" class="icon-btn" aria-label="Вимкнути звук">🔊</button>
                        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.9" aria-label="Гучність" />
                    </div>
                </div>

                <!-- Audio Element (hidden) -->
                <audio id="audioPlayer" preload="metadata"></audio>
            </section>

            <!-- Navigation Tabs -->
            <nav id="tab-navigation" class="tab-nav" role="tablist" aria-label="Категорії станцій">
                <button class="tab-btn active" data-tab="all" role="tab" aria-selected="true">Усі</button>
                <button class="tab-btn" data-tab="favorites" role="tab" aria-selected="false">⭐ Обране</button>
                <button class="tab-btn" data-tab="history" role="tab" aria-selected="false">🕐 Історія</button>
                <button class="tab-btn" data-tab="search" role="tab" aria-selected="false">🔍 Пошук</button>
                <button id="addTabBtn" class="tab-btn add-tab" aria-label="Додати вкладку">+</button>
            </nav>

            <!-- Station List -->
            <section id="station-list-section" aria-label="Список станцій">
                <div id="stationList" class="station-list" role="list">
                    <div class="station-item empty">Завантаження...</div>
                </div>
                
                <!-- Search Inputs (hidden by default) -->
                <div id="searchContainer" class="search-container" style="display: none;">
                    <input type="text" id="searchQuery" placeholder="Назва станції..." aria-label="Пошук за назвою" />
                    <input type="text" id="searchCountry" placeholder="Країна..." aria-label="Пошук за країною" list="countrySuggestions" />
                    <datalist id="countrySuggestions"></datalist>
                    <input type="text" id="searchGenre" placeholder="Жанр..." aria-label="Пошук за жанром" list="genreSuggestions" />
                    <datalist id="genreSuggestions"></datalist>
                    <button id="searchBtn" class="btn primary">🔍 Пошук</button>
                </div>
            </section>
        </main>

        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="loading-indicator" role="status" aria-label="Завантаження" style="display: none;"></div>

        <!-- Toast Container -->
        <div id="toastContainer" class="toast-container" role="alert"></div>
    </div>

    <!-- JavaScript Modules -->
    <script type="module" src="src/js/app.js"></script>
</body>
</html>
