<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <meta name="theme-color" content="#00E676">
  <meta name="description" content="Radio Music S O - Слухайте улюблені радіостанції з сучасним інтерфейсом та функціями">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Radio Music S O</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://de1.api.radio-browser.info">
</head>
<body>
  <div class="container">
    <!-- Тема + меню ⋯ -->
    <button class="theme-toggle" aria-label="Змінити тему">🌙</button>
    <div class="more-menu">
      <button type="button" class="more-btn" id="moreMenuBtn" aria-label="Меню" aria-expanded="false">⋯</button>
      <div class="more-dropdown" id="moreDropdown" hidden>
        <button type="button" class="more-item share-button" aria-label="Поділитися"><span class="mi">↗</span> Поділитися</button>
        <button type="button" class="more-item export-button" aria-label="Експорт"><span class="mi">↑</span> Експорт</button>
        <button type="button" class="more-item import-button" aria-label="Імпорт"><span class="mi">↓</span> Імпорт</button>
        <button type="button" class="more-item bt-watch-btn" id="btWatchBtn" aria-label="BT стеження"><span class="mi">◉</span> BT стеження: увімк</button>
        <div class="sleep-wrap">
        <button type="button" class="more-item" id="sleepTimerBtn" aria-label="Таймер сну" aria-expanded="false"><span class="mi">◔</span> Таймер сну</button>
        <div class="sleep-menu" id="sleepTimerMenu" hidden>
          <button type="button" class="sleep-opt" data-mins="15">15 хв</button>
          <button type="button" class="sleep-opt" data-mins="30">30 хв</button>
          <button type="button" class="sleep-opt" data-mins="60">60 хв</button>
          <button type="button" class="sleep-opt" data-mins="0">Вимкнути</button>
        </div>
      </div>
      </div>
    </div>
    <input type="file" id="importFileInput" accept="application/json" aria-label="Файл для імпорту налаштувань">
    
    <h1>Radio S O</h1>
    <audio id="audioPlayer" aria-label="Аудіоплеєр" preload="auto"></audio>

    <!-- Loading Indicator -->
    <div class="loading-indicator" id="loadingIndicator" role="status" aria-label="Завантаження"></div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer" role="alert"></div>

    <!-- Current Station Info -->
    <div id="currentStationInfo" role="region" aria-label="Інформація про поточну станцію">
      <div class="station-info-content">
        <button type="button" class="station-icon" id="stationIconBtn" aria-label="Now Playing">🎵</button>
        <div class="station-text">
          <div class="station-name" aria-label="Назва станції">Виберіть станцію</div>
          <div class="station-genre" aria-label="Жанр">жанр: -</div>
          <div class="station-country" aria-label="Країна">країна: -</div>
          <div class="current-track" id="currentTrack" aria-label="Поточний трек">🎵 Трек: невідомо</div>
          <div class="playback-status" id="playbackStatus" aria-live="polite"></div>
        </div>
        <!-- Bars visualizer -->
        <div class="wave-visualizer bars-visualizer" aria-hidden="true">
          <span class="bar"></span><span class="bar"></span><span class="bar"></span>
          <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </div>
      </div>
    </div>

    <!-- Station List -->
    <div class="station-list" id="stationList" role="list" aria-label="Список станцій"></div>

    <!-- Tabs -->
    <div class="tabs-wrapper">
      <div class="tabs" id="tabs" role="tablist" aria-label="Категорії станцій">
        <!-- Таби генеруються динамічно через JavaScript -->
      </div>
    </div>

    <!-- Search Input -->
    <div id="searchInput" role="search" aria-label="Пошук станцій" style="display: none;" class="search-collapsed">
      <button type="button" class="search-toggle-bar" id="searchToggleBar" aria-expanded="false">
        <span class="search-toggle-icon">🔍</span>
        <span class="search-toggle-label" id="searchToggleLabel">Пошук…</span>
        <span class="search-toggle-chevron">▾</span>
      </button>
      <div class="search-fields" id="searchFields" hidden>
        <input id="searchQuery" list="pastSearches" placeholder="Назва станції" aria-label="Пошук за назвою станції">
        <datalist id="pastSearches"></datalist>
        <input id="searchCountry" list="suggestedCountries" placeholder="Країна" aria-label="Пошук за країною">
        <datalist id="suggestedCountries"></datalist>
        <input id="searchGenre" list="suggestedGenres" placeholder="Жанр" aria-label="Пошук за жанром">
        <datalist id="suggestedGenres"></datalist>
        <button class="search-btn" aria-label="Виконати пошук">🔍 Знайти</button>
      </div>
      <div class="search-chips" id="searchChips" hidden></div>
    </div>

    <!-- Controls -->
    <div class="controls-container">
      <div class="controls">
        <button class="control-btn" aria-label="Попередня станція">⏮</button>
        <button class="control-btn" aria-label="Грати/Пауза">▶</button>
        <button class="control-btn" aria-label="Наступна станція">⏭</button>
      </div>
    </div>

    <!-- New Tab Modal -->
    <div class="new-tab-modal modal-overlay" style="display: none;" role="dialog" aria-label="Створити нову вкладку">
      <div class="modal">
        <h2>Створити нову вкладку</h2>
        <input id="newTabName" type="text" placeholder="Введіть назву вкладки (a-z, 0-9, -, _)" aria-label="Назва нової вкладки" maxlength="10" pattern="[a-z0-9_-]+">
        <div class="modal-tabs">
          <button id="createTabBtn" class="modal-tab-btn" aria-label="Створити вкладку">Створити</button>
          <button class="modal-cancel-btn" aria-label="Скасувати">Скасувати</button>
        </div>
      </div>
    </div>

    <!-- Edit Tab Modal -->
    <div class="edit-tab-modal modal-overlay" style="display: none;" role="dialog" aria-label="Редагувати вкладку">
      <div class="modal">
        <h2>Дії з вкладкою</h2>
        <input id="renameTabName" type="text" placeholder="Введіть нову назву вкладки" aria-label="Нова назва вкладки" maxlength="10" pattern="[a-z0-9_-]+">
        <div class="modal-tabs">
          <button id="renameTabBtn" class="modal-tab-btn" aria-label="Перейменувати вкладку">Перейменувати</button>
          <button class="modal-cancel-btn" aria-label="Видалити вкладку">Видалити</button>
          <button class="modal-cancel-btn" aria-label="Скасувати">Скасувати</button>
        </div>
      </div>
    </div>

  </div>

  <div id="nowPlayingSheet" class="np-sheet" hidden>
    <div class="np-backdrop" id="npBackdrop"></div>
    <div class="np-card" id="npCard" role="dialog" aria-label="Now Playing">
      <div class="np-handle" aria-hidden="true"></div>
      <div class="np-art" id="npArt">🎵</div>
      <div class="np-name" id="npName">—</div>
      <div class="np-meta" id="npGenre">жанр: —</div>
      <div class="np-meta" id="npCountry">країна: —</div>
      <div class="np-track" id="npTrack">🎵 Трек: невідомо</div>
      <div class="np-status" id="npStatus"></div>
      <div class="np-seek" id="npSeekWrap" hidden>
        <input type="range" id="npSeek" min="0" max="1000" value="0" aria-label="Прогрес">
        <div class="np-time"><span id="npPos">0:00</span><span id="npDur">0:00</span></div>
      </div>
      <div class="np-local-opts" id="npLocalOpts" hidden>
        <button type="button" class="np-opt" id="npShuffle" aria-label="Shuffle">Shuffle</button>
        <button type="button" class="np-opt" id="npRepeat" aria-label="Repeat">Repeat</button>
      </div>
      <div class="np-controls">
        <button type="button" class="np-btn" id="npPrev" aria-label="Попередня">⏮</button>
        <button type="button" class="np-btn np-play" id="npPlay" aria-label="Грати">▶</button>
        <button type="button" class="np-btn" id="npNext" aria-label="Наступна">⏭</button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(error => {
          console.log('ServiceWorker registration failed: ', error);
        });
      });
    }
  </script>
  <script src="script.js"></script>
</body>
</html>
